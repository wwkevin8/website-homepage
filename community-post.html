<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.ico?v=20260509">
  <link rel="icon" href="/favicon.png?v=20260509" type="image/png">
  <title>帖子详情｜NGN 学生信息广场</title>
  <meta name="description" content="NGN 学生信息广场帖子详情。">
  <link rel="stylesheet" href="./community.css?v=20260517-community-1">
</head>
<body class="community-page" data-community-page="detail">
  <div class="community-shell">
    <header class="community-topbar">
      <a class="community-brand" href="./community.html">
        <span class="community-mark">NGN</span>
        <span>学生信息广场</span>
      </a>
      <nav class="community-nav" aria-label="社区导航">
        <a href="./community.html">返回列表</a>
        <a href="./community-submit.html">发布信息</a>
        <span data-site-auth-nav data-auth-login-label="登录"></span>
      </nav>
    </header>

    <main class="community-layout">
      <section class="community-detail">
        <article class="community-panel community-detail-article" data-community-post-root>
          <p class="community-message">正在读取帖子...</p>
        </article>
        <section class="community-panel">
          <h2>评论</h2>
          <p class="community-help">请保持评论友好、真实、合法。请勿发布联系方式、广告、攻击性内容、隐私信息或外部链接。</p>
          <div class="community-comments-list" data-comment-list>
            <p class="community-help">正在读取评论...</p>
          </div>
          <form class="community-comment-box" data-comment-form>
            <textarea class="community-search" name="content" maxlength="300" placeholder="登录后可以评论，最多 300 字。"></textarea>
            <button class="community-button community-button-primary" type="submit">发表评论</button>
          </form>
          <p class="community-message" data-comment-message></p>
        </section>
      </section>

      <aside class="community-side">
        <section class="community-panel">
          <h2>联系提示</h2>
          <p>如需联系发布者，请通过页面指引联系 NGN 客服或等待后续联系功能开放。</p>
          <button class="community-button community-button-danger" type="button" data-report-post>举报帖子</button>
          <p class="community-message" data-report-message></p>
        </section>
        <section class="community-panel">
          <h2>NGN 服务入口</h2>
          <div class="community-service-panel" data-category-services>
            <a href="./pickup.html">接机 / 拼车</a>
            <a href="./storage.html">寄存</a>
            <a href="./moving.html">搬家</a>
            <a href="./service-center.html">订房咨询</a>
            <a href="./service-center.html">联系客服</a>
          </div>
        </section>
        <section class="community-panel">
          <h2>免责声明</h2>
          <p>平台仅提供信息展示，不担保交易真实性、付款安全、商品质量、图片内容真实性、房源真实性、合同有效性或转租成功。用户需自行核实信息。</p>
        </section>
      </aside>
    </main>
  </div>

  <script src="./site-auth.js?v=20260517-community-1"></script>
  <script src="./community.js?v=20260517-community-1"></script>
</body>
</html>
