<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.ico?v=20260509">
  <link rel="icon" href="/favicon.png?v=20260509" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20260509">
  <title>会员权益 | NGN 管理后台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=20260513-membership-2">
</head>
<body
  data-admin-shell
  data-admin-page="memberships"
  data-admin-section="运营后台"
  data-admin-title="会员权益"
  data-admin-description="手动开通 2026-27 NGN 会员，查看权益选择、订单绑定和核销记录。"
>
  <div class="admin-layout">
    <aside class="admin-sidebar" data-admin-sidebar></aside>
    <div class="admin-main">
      <header class="admin-header" data-admin-header></header>
      <main class="admin-content" data-admin-content>
        <section class="admin-page" id="adminMembershipsPage">
          <section class="admin-panel">
            <form class="admin-toolbar admin-toolbar-inline" id="adminMembershipSearchForm">
              <label class="field">
                <span>搜索用户</span>
                <input type="text" name="search" placeholder="姓名 / 邮箱 / 手机号 / 微信">
              </label>
              <div class="admin-inline-actions">
                <button class="button button-primary" type="submit">搜索用户</button>
                <button class="button button-secondary" type="reset">重置</button>
              </div>
            </form>
            <div id="adminMembershipUserResults"></div>
          </section>

          <section class="admin-panel">
            <form class="admin-form-grid" id="adminMembershipGrantForm">
              <input type="hidden" name="site_user_id" required>
              <label class="field">
                <span>已选择用户</span>
                <input type="text" name="selected_user_label" placeholder="请先从上方搜索结果选择用户" readonly>
              </label>
              <label class="field">
                <span>会员周期</span>
                <input type="text" name="membership_cycle" value="2026-27" required>
              </label>
              <p class="transport-form-message admin-field-span-2" id="adminMembershipGrantMessage"></p>
              <div class="admin-inline-actions admin-field-span-2">
                <button class="button button-primary" type="submit">开通会员</button>
              </div>
            </form>
          </section>

          <section class="admin-panel">
            <div class="admin-panel-head">
              <div>
                <h2>一次性会员激活码</h2>
                <p>用于减少人工开通会员。激活码只能使用一次，明文只在生成后显示一次。</p>
              </div>
              <form class="admin-panel-head-actions" id="adminMembershipCodeSearchForm">
                <label class="field">
                  <span>搜索激活码</span>
                  <input type="text" name="search" placeholder="输入激活码前缀">
                </label>
                <button class="button button-primary" type="submit">搜索</button>
                <button class="button button-secondary" type="reset">重置</button>
              </form>
            </div>
            <form class="admin-form-grid" id="adminMembershipCodeForm">
              <input type="hidden" name="membership_cycle" value="2026-27">
              <p class="admin-table-subtle admin-field-span-2">会员周期：<strong>2026-27</strong></p>
              <p class="transport-form-message admin-field-span-2" id="adminMembershipCodeMessage"></p>
              <div class="admin-field-span-2" id="adminMembershipGeneratedCode" hidden></div>
              <div class="admin-inline-actions admin-field-span-2">
                <button class="button button-primary" type="submit">生成 2026-27 会员激活码</button>
                <button class="button button-secondary" type="button" id="adminMembershipCodesRefresh">刷新激活码列表</button>
              </div>
            </form>
            <div id="adminMembershipCodesTable"></div>
          </section>

          <section class="admin-panel">
            <form class="admin-toolbar admin-toolbar-inline" id="adminMembershipFilters">
              <label class="field">
                <span>会员搜索</span>
                <input type="text" name="search" placeholder="姓名 / 邮箱 / 手机号 / 微信">
              </label>
              <label class="field">
                <span>会员周期</span>
                <input type="text" name="cycle" value="2026-27">
              </label>
              <label class="field">
                <span>会员状态</span>
                <select name="status">
                  <option value="">全部</option>
                  <option value="unused">有效 / 未使用</option>
                  <option value="selected">已选择</option>
                  <option value="reserved">已绑定订单</option>
                  <option value="used">已使用</option>
                  <option value="manual">人工记录</option>
                  <option value="cancelled">已作废</option>
                  <option value="expired">已过期</option>
                </select>
              </label>
              <label class="field">
                <span>权益类型</span>
                <select name="benefit_type">
                  <option value="">全部</option>
                  <option value="storage">寄存</option>
                  <option value="pickup">接机</option>
                  <option value="moving">搬家</option>
                  <option value="welcome_pack">新生大礼包</option>
                </select>
              </label>
              <div class="admin-inline-actions">
                <button class="button button-primary" type="submit">刷新列表</button>
                <button class="button button-secondary" type="reset">重置</button>
              </div>
            </form>
          </section>

          <section id="adminMembershipsTable"></section>
          <div class="transport-pagination" id="adminMembershipsPagination"></div>
        </section>
      </main>
    </div>
  </div>

  <script src="./admin-api.js?v=20260513-membership-2"></script>
  <script src="./admin-shell.js?v=20260513-membership-2"></script>
  <script src="./admin-memberships.js?v=20260513-membership-2"></script>
</body>
</html>
