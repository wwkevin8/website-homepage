<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="./admin-legacy-guard.js?v=20260520-admin-launch"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.ico?v=20260509">
  <link rel="icon" href="/favicon.png?v=20260509" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20260509">
  <title>寄存管理 | NGN 管理后台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=20260506-cache-bust-24">
</head>
<body
  data-admin-shell
  data-admin-page="storage"
  data-admin-section="运营后台"
  data-admin-title="寄存管理"
  data-admin-description="集中查看取寄存、送寄存订单和需要送箱的买箱订单。"
>
  <div class="admin-layout">
    <aside class="admin-sidebar" data-admin-sidebar></aside>
    <div class="admin-main">
      <header class="admin-header" data-admin-header></header>
      <main class="admin-content" data-admin-content>
        <section class="admin-page" id="adminStoragePage">
          <section class="admin-panel">
            <form class="admin-toolbar admin-toolbar-inline" id="adminStorageFilters">
              <input type="hidden" name="order_type" value="storage_collection">
              <label class="field">
                <span>搜索</span>
                <input type="text" name="search" placeholder="User ID / 订单编号 / 姓名 / 邮箱 / 电话">
              </label>
              <label class="field">
                <span>单据范围</span>
                <select name="date_scope">
                  <option value="active" selected>有效单</option>
                  <option value="expired">过期单</option>
                  <option value="all">全部</option>
                </select>
              </label>
              <label class="field">
                <span>开始日期</span>
                <input type="date" name="date_start">
              </label>
              <label class="field">
                <span>结束日期</span>
                <input type="date" name="date_end">
              </label>
              <label class="field">
                <span>排序方式</span>
                <select name="sort">
                  <option value="service_date_asc" selected>服务日期最近到最远</option>
                  <option value="created_at_desc">提交时间最近到最远</option>
                </select>
              </label>
              <div class="admin-inline-actions">
                <button class="button button-primary" type="submit">查询</button>
                <button class="button button-secondary" type="button" id="adminStorageExportButton">导出Excel</button>
              </div>
            </form>
          </section>
          <section id="adminStorageList"></section>
          <div class="transport-pagination" id="adminStoragePagination"></div>
        </section>
      </main>
    </div>
  </div>

  <div class="admin-overlay" id="adminConfirmModal" hidden>
    <section class="admin-modal" role="dialog" aria-modal="true">
      <h2 data-confirm-title>确认操作</h2>
      <p data-confirm-text>请确认后继续。</p>
      <div class="admin-inline-actions">
        <button class="button button-secondary" type="button" data-confirm-close>取消</button>
        <button class="button button-primary" type="button" data-confirm-submit>确认</button>
      </div>
    </section>
  </div>

  <script src="./admin-api.js?v=20260506-cache-bust-24"></script>
  <script src="./admin-shell.js?v=20260512-storage-nav-1"></script>
  <script src="./admin-pages.js?v=20260512-storage-nav-1"></script>
</body>
</html>
