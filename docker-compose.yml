services:
  web:
    build:
      context: .
    image: webside-transport-dispatch:local
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      PORT: 3000
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      STORAGE_ORDER_ADMIN_URL: ${STORAGE_ORDER_ADMIN_URL:-http://localhost:3000/admin/storage/orders}
      DOCKER_SUPABASE_URL: ${DOCKER_SUPABASE_URL:-http://host.docker.internal:54321}
      SUPABASE_URL: ${DOCKER_SUPABASE_URL:-http://host.docker.internal:54321}
      SUPABASE_ANON_KEY: ${LOCAL_SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${LOCAL_SUPABASE_SERVICE_ROLE_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
